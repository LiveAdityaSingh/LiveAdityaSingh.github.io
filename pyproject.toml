[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mltva"
version = "0.1.0"
description = "Multi-Agent Medical Diagnostic Validation — Decision-support research prototype"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "ollama",
    "pytest",
    "python-dotenv",
    "datasets",
    # M2: Cardiology specialist dependencies
    "torch>=2.0",
    "scipy>=1.11",
    "wfdb>=4.0",
    "scikit-learn>=1.3",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest-cov",
    "ruff",
]

[tool.setuptools.packages.find]
include = ["schemas*", "agents*", "graph*", "evals*"]
exclude = ["tests*", "data*", "docs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
